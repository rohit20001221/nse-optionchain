<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NIFTY Live GEX Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body
        class="bg-white text-black min-h-screen font-mono antialiased selection:bg-black selection:text-white"
    >
        <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
            <!-- Top Header -->
            <header
                class="flex flex-wrap items-center justify-between gap-4 border-b border-neutral-300 pb-4"
            >
                <div>
                    <h1
                        class="text-2xl font-bold tracking-tight text-black uppercase"
                    >
                        NIFTY Gamma Exposure (GEX)
                    </h1>
                    <p class="text-xs text-neutral-600 mt-1">
                        EXPIRY:
                        <span id="expiryDate" class="text-black font-semibold"
                            >--</span
                        >
                        &bull; LAST TICK:
                        <span id="lastUpdated" class="text-black font-semibold"
                            >--</span
                        >
                    </p>
                </div>
                <div
                    class="flex items-center gap-2.5 bg-neutral-50 border border-neutral-300 px-3.5 py-1.5 text-xs uppercase tracking-wider"
                >
                    <span
                        id="statusDot"
                        class="h-2 w-2 rounded-full bg-neutral-400 animate-pulse"
                    ></span>
                    <span id="statusText" class="text-neutral-700 font-semibold"
                        >Connecting...</span
                    >
                </div>
            </header>

            <!-- KPI Cards -->
            <section
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"
            >
                <div class="bg-neutral-50 border border-neutral-300 p-4">
                    <p
                        class="text-[11px] uppercase tracking-widest text-neutral-500"
                    >
                        NIFTY Spot
                    </p>
                    <p
                        id="spotPrice"
                        class="text-2xl font-bold text-black mt-1"
                    >
                        --
                    </p>
                </div>
                <div class="bg-neutral-50 border border-neutral-300 p-4">
                    <p
                        class="text-[11px] uppercase tracking-widest text-neutral-500"
                    >
                        Total Net GEX
                    </p>
                    <p
                        id="totalNetGex"
                        class="text-2xl font-bold text-black mt-1"
                    >
                        --
                    </p>
                </div>
                <div class="bg-neutral-50 border border-neutral-300 p-4">
                    <p
                        class="text-[11px] uppercase tracking-widest text-neutral-500"
                    >
                        Zero Gamma Flip
                    </p>
                    <p
                        id="zeroGamma"
                        class="text-2xl font-bold text-black mt-1"
                    >
                        --
                    </p>
                </div>
                <div class="bg-neutral-50 border border-neutral-300 p-4">
                    <p
                        class="text-[11px] uppercase tracking-widest text-neutral-500"
                    >
                        Total Call GEX
                    </p>
                    <p
                        id="totalCallGex"
                        class="text-2xl font-bold text-black mt-1"
                    >
                        --
                    </p>
                </div>
                <div class="bg-neutral-50 border border-neutral-300 p-4">
                    <p
                        class="text-[11px] uppercase tracking-widest text-neutral-500"
                    >
                        Total Put GEX
                    </p>
                    <p
                        id="totalPutGex"
                        class="text-2xl font-bold text-neutral-600 mt-1"
                    >
                        --
                    </p>
                </div>
            </section>

            <!-- Main Chart + Table Grid -->
            <section class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- Vertical Net GEX Bar Chart -->
                <div
                    class="lg:col-span-7 bg-white border border-neutral-300 p-5 flex flex-col"
                >
                    <div
                        class="flex flex-wrap items-center justify-between gap-2 mb-4 border-b border-neutral-200 pb-3"
                    >
                        <h2
                            class="text-sm font-bold uppercase tracking-wider text-black"
                        >
                            Net GEX by Strike (ATM &plusmn; 15)
                        </h2>
                        <div
                            class="flex items-center gap-4 text-[11px] text-neutral-600"
                        >
                            <span class="flex items-center gap-1.5">
                                <span
                                    class="inline-block w-3 h-3 bg-black border border-black"
                                ></span>
                                +GEX
                            </span>
                            <span class="flex items-center gap-1.5">
                                <span
                                    class="inline-block w-3 h-3 bg-neutral-200 border border-neutral-700"
                                ></span>
                                -GEX
                            </span>
                        </div>
                    </div>
                    <div class="relative flex-1 min-h-[460px]">
                        <canvas id="gexChart"></canvas>
                    </div>
                </div>

                <!-- Strike Breakdown Table -->
                <div
                    class="lg:col-span-5 bg-white border border-neutral-300 overflow-hidden flex flex-col"
                >
                    <div class="p-4 border-b border-neutral-300 bg-neutral-50">
                        <h2
                            class="text-sm font-bold uppercase tracking-wider text-black"
                        >
                            Strike-by-Strike GEX
                        </h2>
                    </div>
                    <div class="overflow-y-auto max-h-[500px]">
                        <table class="w-full text-xs text-right">
                            <thead
                                class="bg-neutral-100 text-neutral-600 uppercase tracking-wider border-b border-neutral-300 sticky top-0"
                            >
                                <tr>
                                    <th class="px-4 py-3 text-left">Strike</th>
                                    <th class="px-4 py-3">Call GEX</th>
                                    <th class="px-4 py-3">Put GEX</th>
                                    <th class="px-4 py-3">Net GEX</th>
                                </tr>
                            </thead>
                            <tbody
                                id="gexTableBody"
                                class="divide-y divide-neutral-200"
                            >
                                <tr>
                                    <td
                                        colspan="4"
                                        class="px-4 py-8 text-center text-neutral-400"
                                    >
                                        Waiting for WebSocket stream...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>

        <script>
            const fmtCompact = new Intl.NumberFormat("en-IN", {
                notation: "compact",
                maximumFractionDigits: 2,
            });
            const fmtNumber = new Intl.NumberFormat("en-IN", {
                maximumFractionDigits: 2,
            });

            // Initialize vertical Chart.js bar chart in light monochrome theme
            const ctx = document.getElementById("gexChart").getContext("2d");
            const gexChart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: "Net GEX",
                            data: [],
                            backgroundColor: [],
                            borderColor: [],
                            borderWidth: 1,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 150 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: "#ffffff",
                            titleColor: "#000000",
                            bodyColor: "#262626",
                            borderColor: "#000000",
                            borderWidth: 1,
                            callbacks: {
                                label: (ctx) =>
                                    `Net GEX: ${fmtNumber.format(ctx.raw)}`,
                            },
                        },
                    },
                    scales: {
                        x: {
                            grid: { color: "rgba(0, 0, 0, 0.06)" },
                            ticks: {
                                color: "#262626",
                                font: { family: "monospace", size: 11 },
                                maxRotation: 60,
                                minRotation: 45,
                            },
                        },
                        y: {
                            grid: {
                                color: (ctx) =>
                                    ctx.tick.value === 0
                                        ? "rgba(0, 0, 0, 0.65)"
                                        : "rgba(0, 0, 0, 0.08)",
                                lineWidth: (ctx) =>
                                    ctx.tick.value === 0 ? 1.5 : 1,
                            },
                            ticks: {
                                color: "#525252",
                                font: { family: "monospace", size: 11 },
                                callback: (val) => fmtCompact.format(val),
                            },
                        },
                    },
                },
            });

            function updateDashboard(data) {
                document.getElementById("expiryDate").textContent =
                    data.expiry_date || "--";
                document.getElementById("lastUpdated").textContent =
                    data.updated_at || "--";
                document.getElementById("spotPrice").textContent =
                    fmtNumber.format(data.spot_price);
                document.getElementById("zeroGamma").textContent =
                    data.zero_gamma_strike
                        ? fmtNumber.format(data.zero_gamma_strike)
                        : "N/A";

                const netEl = document.getElementById("totalNetGex");
                netEl.textContent = fmtCompact.format(data.total_net_gex);
                netEl.className = `text-2xl font-bold mt-1 ${
                    data.total_net_gex >= 0 ? "text-black" : "text-neutral-500"
                }`;

                document.getElementById("totalCallGex").textContent =
                    fmtCompact.format(data.total_call_gex);
                document.getElementById("totalPutGex").textContent =
                    fmtCompact.format(data.total_put_gex);

                const strikes = data.strikes || [];
                if (!strikes.length) return;

                // Find ATM index to center +/- 15 strikes
                let atmIdx = 0;
                let minDiff = Infinity;
                strikes.forEach((s, idx) => {
                    const diff = Math.abs(s.strike - data.spot_price);
                    if (diff < minDiff) {
                        minDiff = diff;
                        atmIdx = idx;
                    }
                });

                const windowStrikes = strikes.slice(
                    Math.max(0, atmIdx - 15),
                    Math.min(strikes.length, atmIdx + 16),
                );

                // Update Vertical Chart
                gexChart.data.labels = windowStrikes.map((s) =>
                    s.strike === strikes[atmIdx].strike
                        ? `${s.strike}*`
                        : `${s.strike}`,
                );
                gexChart.data.datasets[0].data = windowStrikes.map(
                    (s) => s.net_gex,
                );

                // Positive GEX = Solid Black | Negative GEX = Light Grey with Dark Border
                gexChart.data.datasets[0].backgroundColor = windowStrikes.map(
                    (s) => (s.net_gex >= 0 ? "#000000" : "#e5e5e5"),
                );
                gexChart.data.datasets[0].borderColor = windowStrikes.map(
                    (s) => (s.net_gex >= 0 ? "#000000" : "#525252"),
                );
                gexChart.update();

                // Update Table
                const tbody = document.getElementById("gexTableBody");
                tbody.innerHTML = windowStrikes
                    .map((s) => {
                        const isAtm = s.strike === strikes[atmIdx].strike;
                        const netStyle =
                            s.net_gex >= 0
                                ? "text-black font-bold"
                                : "text-neutral-500";
                        return `
            <tr class="${isAtm ? "bg-black text-white font-bold" : "hover:bg-neutral-100"}">
              <td class="px-4 py-2.5 text-left">
                ${s.strike} ${isAtm ? '<span class="ml-1 text-[10px] border border-white px-1">ATM</span>' : ""}
              </td>
              <td class="px-4 py-2.5 ${isAtm ? "text-white" : "text-neutral-800"}">${fmtCompact.format(s.call_gex)}</td>
              <td class="px-4 py-2.5 ${isAtm ? "text-neutral-300" : "text-neutral-500"}">${fmtCompact.format(s.put_gex)}</td>
              <td class="px-4 py-2.5 ${isAtm ? "text-white" : netStyle}">${fmtCompact.format(s.net_gex)}</td>
            </tr>
          `;
                    })
                    .join("");
            }

            // Connect to relative /ws endpoint
            function connectWebSocket() {
                const statusDot = document.getElementById("statusDot");
                const statusText = document.getElementById("statusText");

                const wsProtocol =
                    window.location.protocol === "https:" ? "wss:" : "ws:";
                const ws = new WebSocket(
                    `${wsProtocol}//${window.location.host}/ws`,
                );

                ws.onopen = () => {
                    statusDot.className = "h-2 w-2 rounded-full bg-black";
                    statusText.textContent = "Live Connected";
                };

                ws.onmessage = (event) => {
                    const payload = JSON.parse(event.data);
                    updateDashboard(payload);
                };

                ws.onclose = () => {
                    statusDot.className = "h-2 w-2 rounded-full bg-neutral-400";
                    statusText.textContent = "Disconnected — Retrying in 3s...";
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = () => ws.close();
            }

            connectWebSocket();
        </script>
    </body>
</html>
